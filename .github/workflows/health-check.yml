# Daily health check for indexfast.co.
# Why: production regressions (dead routes, broken sitemap entries, failing tests) used to go
# unnoticed for days. This runs the code quality gates and a live smoke test every day and
# opens (or updates) a single GitHub issue when anything fails, so there is one place to look.
# It never deploys, never touches secrets beyond the default token, and never writes to main.
name: Health check

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 Asia/Kolkata
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - run: bun run prep
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run test

  smoke:
    name: Live smoke test
    # Only the scheduled/manual runs hit production; PRs and pushes test code only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check public routes and every sitemap URL
        run: bash scripts/smoke-test.sh https://indexfast.co

  report:
    name: Open issue on failure
    needs: [quality, smoke]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the health issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One open issue, commented on each failing day, instead of a new issue per run.
          title="Daily health check failing"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          body="Health check failed on $(date -u +%Y-%m-%d). Details: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
